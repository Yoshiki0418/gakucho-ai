events {
    worker_connections 1024;
}

http {
    keepalive_timeout 600s;

    # WebSocket の振り分け用 Map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 30929 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # 重要：ルート (/) へのアクセス
        location / {
            # デフォルト設定 (frontend)
            proxy_pass http://frontend:30212;

            # WebSocket 通信の場合のみ UE (Signalling Server) へ
            if ($http_upgrade = "websocket") {
                proxy_pass http://192.168.29.19:80;
            }

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # バックエンド (API)
        location /api/ {
            proxy_pass http://backend:8077;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # バックエンド (WebSocket - 音声ストリーム用)
        location /ws/ {
            proxy_pass http://backend:8077;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # アバター (Pixel Streaming 公開ファイル用)
        location /ue-stream/ {
            proxy_pass http://192.168.29.19:80/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # リップシンク用
        location /lip-sync/ {
            proxy_pass http://192.168.29.19:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}