name: Move PR to Review when ready

on:
  pull_request:
    types: [ready_for_review]

jobs:
  move-to-review:
    runs-on: ubuntu-latest
    steps:
      - name: Move PR to Review in Project v2
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PERSONAL_TOKEN }}
          script: |
            // ✅ ここで明示的に定義（nullになるのを防ぐ）
            const owner = "Yoshiki0418";
            const projectNumber = 8;
            const statusFieldName = "Status";
            const statusValueName = "Review";

            // PR Node ID
            const prId = context.payload.pull_request.node_id;

            // Project ID 取得
            const projectData = await github.graphql(
              `query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }`,
              { owner: owner, number: projectNumber }
            );

            const projectId = projectData.user.projectV2.id;
            console.log(`✅ Project ID: ${projectId}`);

            // ProjectにPRを追加
            const itemData = await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item {
                    id
                  }
                }
              }`,
              { projectId: projectId, contentId: prId }
            );

            const itemId = itemData.addProjectV2ItemById.item.id;

            // StatusフィールドのIDと選択肢取得
            const fields = await github.graphql(
              `query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              { projectId: projectId }
            );

            const statusField = fields.node.fields.nodes.find(f => f.name === statusFieldName);
            if (!statusField) throw new Error(`Status field '${statusFieldName}' not found`);

            const option = statusField.options.find(o => o.name === statusValueName);
            if (!option) throw new Error(`Status value '${statusValueName}' not found`);

            // ステータス更新
            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }`,
              {
                projectId: projectId,
                itemId: itemId,
                fieldId: statusField.id,
                optionId: option.id
              }
            );

            console.log(`✅ Moved PR to '${statusValueName}' in Project ${projectNumber}`);
