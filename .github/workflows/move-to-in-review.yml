name: Move linked issue to In Review when PR is opened

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  move-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issue to In Review
        uses: peter-evans/update-project-item@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          project-url: https://github.com/orgs/ORG_NAME/projects/PROJECT_NUMBER
          item-type: issue
          field: Status
          value: In Review
