name: Move linked Issue to In Progress when PR converted to draft

on:
  pull_request:
    types: [converted_to_draft]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  move-issue-to-in-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Update linked Issue status to In Progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PERSONAL_TOKEN }}
          script: |
            const owner = "Yoshiki0418";
            const projectNumber = 8;
            const statusFieldName = "Status";
            const statusValueName = "In Progress";

            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            console.log(`🔄 PR #${prNumber} が Draft に戻されました。対応する Issue を 'In Progress' に戻します`);

            // --- ① PRタイトル or 本文から Issue番号 を抽出 ---
            const issueMatch = pr.body?.match(/#(\d+)/) || pr.title?.match(/#(\d+)/);
            if (!issueMatch) {
              console.log("⚠️ 対応する Issue が見つかりませんでした。スキップします。");
              return;
            }
            const issueNumber = parseInt(issueMatch[1], 10);
            console.log(`🔗 Issue #${issueNumber} を検出`);

            // --- ② Project ID を取得 ---
            const projectData = await github.graphql(
              `query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }`,
              { owner, number: projectNumber }
            );
            const projectId = projectData.user?.projectV2?.id;
            if (!projectId) throw new Error(`❌ Project ${projectNumber} が見つかりません`);

            // --- ③ Issue の Node ID を取得 ---
            const issueData = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                  }
                }
              }`,
              { owner, repo: context.repo.repo, number: issueNumber }
            );
            const issueId = issueData.repository.issue.id;

            // --- ④ Issue を Project に追加（なければ） ---
            const addRes = await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }`,
              { projectId, contentId: issueId }
            );
            const itemId = addRes.addProjectV2ItemById.item.id;

            // --- ⑤ Status フィールドを In Progress に更新 ---
            const fieldRes = await github.graphql(
              `query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              { projectId }
            );

            const statusField = fieldRes.node.fields.nodes.find(f => f.name === statusFieldName);
            if (!statusField) throw new Error(`❌ Status フィールド '${statusFieldName}' が見つかりません`);

            const option = statusField.options.find(o => o.name === statusValueName);
            if (!option) throw new Error(`❌ ステータス値 '${statusValueName}' が見つかりません`);

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }`,
              { projectId, itemId, fieldId: statusField.id, optionId: option.id }
            );

            console.log(`✅ Issue #${issueNumber} のステータスを '${statusValueName}' に更新しました`);
