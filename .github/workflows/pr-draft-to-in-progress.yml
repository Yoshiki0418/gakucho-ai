name: Move PR back to In Progress when converted to draft

on:
  pull_request:
    types: [converted_to_draft]

permissions:
  contents: read
  pull-requests: read

jobs:
  move-to-in-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Move Draft PR to In Progress in Project v2
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PERSONAL_TOKEN }} # PAT を使用（Project v2 操作用）
          script: |
            const owner = "Yoshiki0418";
            const projectNumber = 8;
            const statusFieldName = "Status";
            const statusValueName = "In Progress";

            // PR Node ID
            const prId = context.payload.pull_request.node_id;
            const prNumber = context.payload.pull_request.number;
            console.log(`🔄 PR #${prNumber} を Draft に戻したので 'In Progress' に遷移します`);

            // --- ① Project IDを取得 ---
            const projectData = await github.graphql(
              `query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }`,
              { owner, number: projectNumber }
            );

            if (!projectData.user || !projectData.user.projectV2) {
              throw new Error(`❌ Project number ${projectNumber} が見つかりません`);
            }

            const projectId = projectData.user.projectV2.id;
            console.log(`✅ Project ID: ${projectId}`);

            // --- ② PR を Project に追加（未登録なら） ---
            const addRes = await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }`,
              { projectId, contentId: prId }
            );

            const itemId = addRes.addProjectV2ItemById.item.id;
            console.log(`✅ Project Item ID: ${itemId}`);

            // --- ③ Status フィールドを "In Progress" に変更 ---
            const fieldRes = await github.graphql(
              `query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              { projectId }
            );

            const statusField = fieldRes.node.fields.nodes.find(f => f.name === statusFieldName);
            if (!statusField) throw new Error(`❌ Status フィールド '${statusFieldName}' が見つかりません`);

            const option = statusField.options.find(o => o.name === statusValueName);
            if (!option) throw new Error(`❌ ステータス値 '${statusValueName}' が見つかりません`);

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }`,
              {
                projectId,
                itemId,
                fieldId: statusField.id,
                optionId: option.id
              }
            );

            console.log(`✅ PR #${prNumber} のステータスを '${statusValueName}' に戻しました ✅`);
