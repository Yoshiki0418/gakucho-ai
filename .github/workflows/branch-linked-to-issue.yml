name: Move Issue to In Progress on branch creation

on:
  create:
    branches:
      - '*'

permissions:
  contents: read
  issues: write

jobs:
  move-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Extract issue number from branch name
        id: extract
        run: |
          echo "🔍 Branch name: ${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_NAME}" =~ ([0-9]+) ]]; then
            echo "ISSUE_NUMBER=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            echo "✅ Detected issue number: ${BASH_REMATCH[1]}"
          else
            echo "No issue number found in branch name"
          fi

      - name: Move linked issue to In Progress
        if: ${{ env.ISSUE_NUMBER != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PERSONAL_TOKEN }} # ← PATを利用
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            const owner = "Yoshiki0418";
            const projectNumber = 8;
            const statusFieldName = "Status";
            const statusValueName = "In Progress";

            // --- ① Project IDを取得 ---
            const projectData = await github.graphql(
              `query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }`,
              { owner, number: projectNumber }
            );

            if (!projectData.user || !projectData.user.projectV2) {
              throw new Error(`❌ Project number ${projectNumber} が見つかりません`);
            }

            const projectId = projectData.user.projectV2.id;
            console.log(`✅ Project ID: ${projectId}`);

            // --- ② Issue の Node ID を取得 ---
            const issueData = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                  }
                }
              }`,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: parseInt(issueNumber, 10)
              }
            );

            const issueId = issueData.repository.issue.id;
            console.log(`✅ Issue ID: ${issueId}`);

            // --- ③ Project に Issue を追加（未登録なら） ---
            const addRes = await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }`,
              { projectId, contentId: issueId }
            );

            const itemId = addRes.addProjectV2ItemById.item.id;
            console.log(`✅ Project item ID: ${itemId}`);

            // --- ④ Status フィールドを「In Progress」に更新 ---
            const fieldRes = await github.graphql(
              `query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              { projectId }
            );

            const statusField = fieldRes.node.fields.nodes.find(f => f.name === statusFieldName);
            if (!statusField) throw new Error(`❌ Statusフィールド '${statusFieldName}' が見つかりません`);
            const option = statusField.options.find(o => o.name === statusValueName);
            if (!option) throw new Error(`❌ ステータス値 '${statusValueName}' が見つかりません`);

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }`,
              {
                projectId,
                itemId,
                fieldId: statusField.id,
                optionId: option.id
              }
            );

            console.log(`✅ Issue #${issueNumber} を '${statusValueName}' に移動しました`);
