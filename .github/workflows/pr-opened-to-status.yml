name: Sync Issue status when PR is created (Draft → In Progress / Ready → Review)

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  sync-issue-status:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Issue status with PR draft state
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PERSONAL_TOKEN }}
          script: |
            const owner = "Yoshiki0418";
            const projectNumber = 8;
            const statusFieldName = "Status";
            const draftStatusValue = "In Progress";
            const reviewStatusValue = "Review";

            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            console.log(`📌 PR #${prNumber} が作成されました（Draft: ${pr.draft}）`);

            // --- ① PR 本文から Issue 番号を抽出 (#15 のようなもの) ---
            const issueMatch = pr.body?.match(/#(\d+)/) || pr.title?.match(/#(\d+)/);
            if (!issueMatch) {
              console.log("⚠️ 関連する Issue が見つかりません。処理をスキップします。");
              return;
            }
            const issueNumber = parseInt(issueMatch[1], 10);
            console.log(`🔗 関連 Issue #${issueNumber} を検出`);

            // --- ② Project ID を取得 ---
            const projectData = await github.graphql(
              `query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }`,
              { owner, number: projectNumber }
            );

            const projectId = projectData.user?.projectV2?.id;
            if (!projectId) throw new Error(`❌ Project number ${projectNumber} が見つかりません`);
            console.log(`✅ Project ID: ${projectId}`);

            // --- ③ Issue の Node ID を取得 ---
            const issueData = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id
                  }
                }
              }`,
              { owner, repo: context.repo.repo, number: issueNumber }
            );
            const issueId = issueData.repository.issue.id;

            // --- ④ Project 内の Issue アイテムを追加（存在しない場合のみ） ---
            const addItemRes = await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }`,
              { projectId, contentId: issueId }
            );
            const itemId = addItemRes.addProjectV2ItemById.item.id;

            // --- ⑤ Status フィールドとオプション取得 ---
            const fieldsRes = await github.graphql(
              `query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              { projectId }
            );

            const statusField = fieldsRes.node.fields.nodes.find(f => f.name === statusFieldName);
            if (!statusField) throw new Error(`❌ Status フィールド '${statusFieldName}' が見つかりません`);

            const targetStatusName = pr.draft ? draftStatusValue : reviewStatusValue;
            const option = statusField.options.find(o => o.name === targetStatusName);
            if (!option) throw new Error(`❌ ステータス値 '${targetStatusName}' が見つかりません`);

            // --- ⑥ ステータス更新 ---
            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }`,
              {
                projectId,
                itemId,
                fieldId: statusField.id,
                optionId: option.id
              }
            );

            console.log(`✅ Issue #${issueNumber} のステータスを '${targetStatusName}' に更新しました`);
