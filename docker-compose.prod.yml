# 本番環境用の docker-compose ファイル
version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: gakucho_prod_nginx
    restart: always
    # LAN IP 宛の Docker NAT がこのホストでは応答しない（応答が eno2 側から出て非対称になる）。
    # nginx 自体は localhost の内部ポートだけに公開し、入口はホスト側の TCP 中継
    # (gakucho-ops/gakucho-port-proxy.py, 192.168.29.19:30929) にする。
    ports:
      - "127.0.0.1:39029:30929"
    # UE (Pixel Streaming / リップシンク) はホスト上で動くため、コンテナからは
    # 固定した Docker ブリッジのゲートウェイ経由で接続する。
    extra_hosts:
      - "host.docker.internal:172.28.0.1"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
  db:
    build:
      context: db
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: "Asia/Tokyo"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        HF_USERNAME: ${HF_USERNAME}
        HF_TOKEN: ${HF_TOKEN}
    ports:
      - "127.0.0.1:8077:8077"
    image: gakucho-ai-backend:prod
    env_file:
      - ./backend/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ENV=prod
      - DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - HF_USERNAME=${HF_USERNAME}
      - HF_TOKEN=${HF_TOKEN}
      - PYTHONPATH=/workspace
      - LLM_SYSTEM_PROMPT_PATH=/workspace/app/prompts/system_prompt.txt
      - TTS_MODEL_DIR=/workspace/app/weights/tts/gakucho_ai_v2
      - TZ=Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8077/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    ports:
      - "127.0.0.1:30212:30212"
    image: gakucho-ai-frontend:prod
    environment:
      - NODE_ENV=production
      - PORT=30212
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=
    depends_on:
      - backend
    restart: unless-stopped

# アプリケーションサービス間のネットワーク。nginx から見た host.docker.internal を
# 固定するため、サブネットとゲートウェイを明示する（ufw は 172.16.0.0/12 を許可済み）。
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
