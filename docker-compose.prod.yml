# 本番環境用の docker-compose ファイル
version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: gakucho_prod_nginx
    restart: always
    ports:
      - "30929:30929"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
  db:
    build:
      context: db
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: "Asia/Tokyo"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        HF_USERNAME: ${HF_USERNAME}
        HF_TOKEN: ${HF_TOKEN}
    ports:
      - "127.0.0.1:8077:8077"
    image: gakucho-ai-backend:prod
    env_file:
      - ./backend/.env
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ENV=prod
      - DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - HF_USERNAME=${HF_USERNAME}
      - HF_TOKEN=${HF_TOKEN}
      - PYTHONPATH=/workspace
      - LLM_SYSTEM_PROMPT_PATH=/workspace/app/prompts/system_prompt.txt
      - TTS_MODEL_DIR=/workspace/app/weights/tts/gakucho_ai_v2
      - TZ=Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8077/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: https://192.168.29.19:30929
    ports:
      - "127.0.0.1:30212:30212"
    image: gakucho-ai-frontend:prod
    environment:
      - NODE_ENV=production
      - PORT=30212 
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=https://192.168.29.19:30929
    depends_on:
      - backend
    restart: unless-stopped