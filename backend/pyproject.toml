[tool.pysen]
version = "0.11.0"

[tool.pysen.lint]
enable_black = true
enable_flake8 = true
enable_isort = true
enable_mypy = false

source = ["backend/"] 

[tool.pysen.lint.source]
exclude_globs = ["**/__init__.py"]

[tool.pytest.ini_options]
addopts = "-s -v"

pythonpath = ["backend"]

testpaths = ["backend/tests"]
markers = [
    "utility"
]