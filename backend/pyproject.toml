
[tool.pysen]
version = "0.12.1"

[tool.pysen.lint]
enable_black = true
enable_flake8 = true
enable_isort = true
enable_mypy = false

[tool.pysen.lint.source]
exclude_globs = ["**/__init__.py", "**/main.py", "**/agent_factory.py", "**/insert_rag_data.py"]

[tool.pytest.ini_options]
addopts = "-s -v"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "utility"
]